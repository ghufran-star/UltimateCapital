name: Build check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: uc
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:pg@localhost:5432/uc
      SETTINGS_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Upgrade a database from the last live schema
        run: |
          git show e6110fc:prisma/schema.prisma > /tmp/old.prisma || git show HEAD~1:prisma/schema.prisma > /tmp/old.prisma
          npx prisma db push --skip-generate --schema /tmp/old.prisma
          PGPASSWORD=pg psql -h localhost -U postgres -d uc -v ON_ERROR_STOP=1 -c "INSERT INTO \"Workspace\" (id, name) VALUES ('w1','Old');
          INSERT INTO \"Contact\" (id, \"workspaceId\", kind, \"updatedAt\") VALUES ('c1','w1','buyer',now()),('c2','w1','buyer',now());
          INSERT INTO \"Property\" (id, \"workspaceId\", address, city, state, zip, \"updatedAt\") VALUES ('p1','w1','1 Main','Houston','TX','77001',now());
          INSERT INTO \"Opportunity\" (id, \"workspaceId\", \"propertyId\", \"updatedAt\") VALUES ('o1','w1','p1',now());
          INSERT INTO \"BuyerInterest\" (id, \"opportunityId\", \"contactId\", \"updatedAt\") VALUES ('i1','o1','c1',now()),('i2','o1','c2',now());"
          set -o pipefail
          node scripts/sync-db.mjs 2>&1 | tee sync.log || { grep -E "\[db\]|Error|error" sync.log | tail -8 | while read -r l; do echo "::error title=schema upgrade::$l"; done; exit 1; }
          grep "\[db\]" sync.log | while read -r l; do echo "::notice title=schema upgrade::$l"; done
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code || { echo "::error title=schema upgrade::database still differs from the schema"; exit 1; }
          PGPASSWORD=pg psql -h localhost -U postgres -d uc -v ON_ERROR_STOP=1 -c 'DELETE FROM "Workspace"'

      - name: Build demo and test compliance rules
        run: npx --yes tsx scripts/smoke.ts
      - name: Start app
        run: |
          RUN_WORKER=false nohup npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3000/api/health && break; sleep 1; done
      - name: Crawl every page
        run: bash scripts/crawl.sh
      - name: Server log on failure
        if: failure()
        run: |
          tail -n 200 server.log || true
          grep -iE "error|prisma" server.log | sort | uniq -c | sort -rn | head -20 | while read -r l; do echo "::error title=server log::$l"; done
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Railway image
        run: |
          set -o pipefail
          docker build --progress=plain -t uc . 2>&1 | tee build.log || { grep -iE "error|ERR!|failed" build.log | tail -15 | while read -r l; do echo "::error title=docker build::$l"; done; exit 1; }
      - name: Start the image and check health
        run: |
          docker run -d --name uc -p 3000:3000 -e PORT=3000 uc
          for i in $(seq 1 60); do curl -sf localhost:3000/api/health && exit 0; sleep 2; done
          docker logs uc 2>&1 | tail -15 | while read -r l; do echo "::error title=container::$l"; done; exit 1

